name: Publish to npm (provenance)

# Publishes @kaptionai/mcp-extension to npm with a signed build-provenance
# attestation. Trigger by pushing a version tag (e.g. `git tag v0.5.4 && git push --tags`)
# or running the workflow manually.
#
# npm trusts this workflow directly (trusted publishing over GitHub OIDC), so
# there is no npm token: the package's npm settings name Kaption-AI/mcp-extension
# and publish.yml as its trusted publisher. Trusted publishing needs npm 11.5.1+.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance via GitHub OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Node 24 ships npm 11; make sure it's new enough for trusted publishing.
      - run: npm install -g npm@^11.5.1

      # npm ci requires package.json and package-lock.json to be in sync.
      - run: npm ci

      # Build + tests run automatically via the package's "prepublishOnly" script.
      # --provenance attaches a signed, publicly verifiable attestation binding the
      # package to this repo + workflow + commit (npm >= 9.5, bundled with Node 20).
      - run: npm publish --provenance --access public
